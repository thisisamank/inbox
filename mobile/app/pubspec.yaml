name: agentic_inbox
description: Agentic Inbox — a mobile client for a self-hosted Cloudflare email inbox with an AI agent.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  api:
    path: ../packages/api
  core:
    path: ../packages/core
  design_system:
    path: ../packages/design_system
  dio: ^5.7.0
  file_picker: ^13.1.0
  flutter_riverpod: ^3.0.0
  flutter_widget_from_html_core: ^0.17.4
  get_it: ^8.0.3
  go_router: ^17.0.0
  path_provider: ^2.1.6
  riverpod_annotation: ^3.0.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0

  flutter_secure_storage: any
  http: any
  pinenacl: any
  web_socket_channel: any
flutter:
  uses-material-design: true
