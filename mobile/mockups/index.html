<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Inbox Mobile Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ECEAE6;
  --surface: #FFFFFF;
  --surface-2: #F5F4F1;
  --line: #E3E1DC;
  --text: #1A1A19;
  --text-2: #5C5A55;
  --text-3: #75726C;
  --accent: #C2410C;
  --accent-soft: #FDEBDD;
  --unread: #1D4ED8;
  --ok: #15803D;
  --danger: #B91C1C;
  --agent: #6D28D9;
  --agent-soft: #EFE9FB;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110;
    --surface: #1C1C1B;
    --surface-2: #252524;
    --line: #33322F;
    --text: #F1EFEA;
    --text-2: #B3B0A8;
    --text-3: #908D86;
    --accent: #F97316;
    --accent-soft: #3A2414;
    --unread: #7AA2FF;
    --ok: #4ADE80;
    --danger: #F87171;
    --agent: #B79CFF;
    --agent-soft: #2A2340;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "IBM Plex Sans", system-ui, sans-serif; }
.page { max-width: 1760px; margin: 0 auto; padding: 40px 16px 80px; }
.page > header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
.page > header p { margin: 0 0 36px; color: var(--text-2); max-width: 70ch; }
.grid { display: flex; flex-wrap: wrap; gap: 48px 40px; }
figure { margin: 0; }
figcaption { font-size: 13px; color: var(--text-2); margin-bottom: 10px; }
figcaption b { color: var(--text); font-weight: 600; margin-right: 6px; }

.phone { width: 390px; max-width: calc(100vw - 32px); height: 844px; background: var(--surface); border: 1px solid var(--line); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08); }
.safe-top { height: 44px; flex: none; }
.safe-bottom { height: 28px; flex: none; }

.appbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; flex: none; }
.appbar .title { flex: 1; min-width: 0; padding: 0 4px; }
.appbar .title strong { display: block; font-size: 20px; font-weight: 600; }
.appbar .title span { display: block; font: 12px/1.3 "IBM Plex Mono", monospace; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--text); border-radius: 22px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 18px; height: 18px; }

.scroll { flex: 1; overflow: auto; min-height: 0; }
.tabs { display: flex; border-top: 1px solid var(--line); flex: none; background: var(--surface); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 4px; min-height: 52px; font-size: 11px; color: var(--text-3); text-decoration: none; }
.tabs a.on { color: var(--accent); font-weight: 500; }

.chip-row { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; flex: none; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; white-space: nowrap; min-height: 32px; }
.chip.on { background: var(--text); color: var(--surface); border-color: var(--text); }

.row { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.avatar { width: 40px; height: 40px; border-radius: 20px; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #fff; }
.row .body { flex: 1; min-width: 0; }
.row .top { display: flex; align-items: baseline; gap: 8px; }
.row .from { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { font-size: 12px; color: var(--text-3); flex: none; }
.row .subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.row .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--text-2); }
.row.unread .from, .row.unread .subj { font-weight: 600; }
.row.unread .time { color: var(--unread); font-weight: 500; }
.count { font: 12px "IBM Plex Mono", monospace; color: var(--text-3); margin-left: 4px; }
.tag-draft { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--agent); background: var(--agent-soft); border-radius: 6px; padding: 2px 8px; }

.fab { position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }

.btn { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-weight: 500; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }

.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 18px 16px 6px; }
.field { display: block; padding: 0 16px 14px; }
.field label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 48px; }
.field textarea { resize: none; }
.mono { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 300px; background: var(--surface); display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 0 20px; min-height: 48px; color: var(--text); text-decoration: none; border-radius: 0 24px 24px 0; margin-right: 12px; }
.nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .n { margin-left: auto; font: 12px "IBM Plex Mono", monospace; color: var(--text-3); }
.nav-item.on .n { color: var(--accent); }

.msg { border-bottom: 1px solid var(--line); padding: 14px 16px; }
.msg.collapsed { color: var(--text-2); }
.msg-head { display: flex; gap: 12px; align-items: center; }
.msg-head .who { flex: 1; min-width: 0; }
.msg-head .who b { display: block; font-weight: 600; }
.msg-head .who span { display: block; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-body { padding: 12px 0 0 52px; font-size: 15px; line-height: 1.55; }
.msg-body p { margin: 0 0 10px; }
.remote-note { display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 13px; color: var(--text-2); }
.remote-note button { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; min-height: 32px; }
.attach { display: flex; align-items: center; gap: 10px; margin: 6px 0 0 52px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.attach .meta { flex: 1; min-width: 0; }
.attach .meta span { display: block; color: var(--text-3); font-size: 12px; }
.action-bar { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); flex: none; }
.action-bar .btn { flex: 1; min-height: 44px; font-size: 14px; }

.draft-card { margin: 14px 16px; border: 1px solid var(--agent); border-radius: 14px; overflow: hidden; }
.draft-card header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--agent-soft); color: var(--agent); font-size: 13px; font-weight: 600; }
.draft-card .txt { padding: 12px; font-size: 14px; line-height: 1.5; }
.draft-card footer { display: flex; gap: 8px; padding: 0 12px 12px; }
.draft-card footer .btn { min-height: 40px; font-size: 13px; flex: 1; }

.compose-row { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 52px; border-bottom: 1px solid var(--line); }
.compose-row .k { width: 52px; color: var(--text-3); font-size: 14px; flex: none; }
.compose-row .v { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; font-size: 13px; }
.compose-body { padding: 16px; font-size: 15px; line-height: 1.6; color: var(--text); }
.compose-body .quote { margin-top: 18px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--text-3); font-size: 13px; }
.keyboard-bar { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid var(--line); flex: none; }

.search-box { display: flex; align-items: center; gap: 8px; margin: 0 16px 10px; padding: 0 12px; min-height: 48px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.search-box input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--text); outline: none; }
.op { font: 12px "IBM Plex Mono", monospace; border: 1px dashed var(--line); background: none; color: var(--text-2); border-radius: 8px; padding: 6px 10px; min-height: 32px; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

.bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; margin: 0 16px 10px; }
.bubble.me { margin-left: auto; background: var(--text); color: var(--surface); border-bottom-right-radius: 4px; }
.bubble.ai { background: var(--surface-2); border-bottom-left-radius: 4px; }
.tool { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; font: 12px "IBM Plex Mono", monospace; color: var(--text-3); }
.tool .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ok); }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex: none; }
.composer textarea { flex: 1; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 22px; padding: 11px 16px; resize: none; min-height: 44px; }
.send { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--agent); color: #fff; display: grid; place-items: center; flex: none; }

.list-item { display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 56px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
.list-item .t { flex: 1; min-width: 0; }
.list-item .t b { display: block; font-weight: 500; }
.list-item .t span { display: block; font-size: 12px; color: var(--text-3); }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--accent); position: relative; flex: none; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; }
.switch.off { background: var(--line); }
.switch.off::after { right: auto; left: 3px; }

.center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 28px; gap: 16px; }
.mark { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.center h2 { margin: 8px 0 0; font-size: 28px; font-weight: 600; line-height: 1.15; }
.center p { margin: 0; color: var(--text-2); }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 0 28px; border-top: 1px solid var(--line); }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.lock { background: linear-gradient(#2B2A28, #1A1918); color: #F1EFEA; }
.lock .clock { text-align: center; font-size: 72px; font-weight: 300; margin-top: 40px; line-height: 1; }
.lock .date { text-align: center; color: #C9C6BF; margin-top: 6px; }
.notif { margin: 32px 12px 0; background: rgba(255,255,255,.12); border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; }
.notif .mark { width: 38px; height: 38px; border-radius: 10px; }
.notif .app { font-size: 12px; color: #C9C6BF; display: flex; justify-content: space-between; }
.notif b { display: block; font-weight: 600; margin-top: 2px; }
.notif .s { font-size: 14px; color: #E5E2DB; }
</style>
</head>

<div class="page">
<header>
  <h1>Agentic Inbox, mobile screens</h1>
  <p>Static mockups for review. Each frame is 390 × 844 (iPhone 14/15). The data in the frames is sample data. Number your feedback by screen.</p>
</header>

<div class="grid">

<!-- 1 Login -->
<figure>
<figcaption><b>01</b>Login through Cloudflare Access</figcaption>
<div class="phone">
  <div class="safe-top"></div>
  <div class="center">
    <div class="mark"><svg class="i" style="width:32px;height:32px" aria-hidden="true"><use href="#mail"/></svg></div>
    <h2>Agentic Inbox</h2>
    <p>Your email, on your Cloudflare account. Sign in with the same Access login you use on the web.</p>
    <div class="field" style="padding:8px 0 0">
      <label for="u1">Inbox URL</label>
      <input id="u1" class="mono" value="agentic-inbox.thisisamank.workers.dev">
      <div class="hint">Saved after the first sign-in.</div>
    </div>
    <button class="btn primary block"><svg class="i sm" aria-hidden="true"><use href="#lock"/></svg>Sign in with Cloudflare Access</button>
  </div>
  <p style="text-align:center;font-size:12px;color:var(--text-3);margin:0 24px 16px">Access opens in a secure browser window. The app stores only the session cookie.</p>
  <div class="safe-bottom"></div>
</div>
</figure>

<!-- 2 Mailbox picker -->
<figure>
<figcaption><b>02</b>Mailbox picker</figcaption>
<div class="phone">
  <div class="safe-top"></div>
  <div class="appbar">
    <div class="title"><strong>Mailboxes</strong><span>agentic-inbox.thisisamank.workers.dev</span></div>
    <button class="icon-btn" aria-label="Settings"><svg class="i" aria-hidden="true"><use href="#gear"/></svg></button>
  </div>
  <div class="scroll">
    <a class="list-item" href="#s3">
      <div class="avatar" style="background:#C2410C">A</div>
      <div class="t"><b>aman@akxr.in</b><span>12 unread · 3 drafts from the agent</span></div>
      <svg class="i sm" aria-hidden="true" style="color:var(--text-3)"><use href="#chev"/></svg>
    </a>
    <a class="list-item" href="#s3">
      <div class="avatar" style="background:#1D4ED8">G</div>
      <div class="t"><b>gupta@akxr.in</b><span>2 unread</span></div>
      <svg class="i sm" aria-hidden="true" style="color:var(--text-3)"><use href="#chev"/></svg>
    </a>
    <div style="padding:20px 16px">
      <button class="btn block"><svg class="i sm" aria-hidden="true"><use href="#plus"/></svg>New mailbox</button>
    </div>
  </div>
  <div class="safe-bottom"></div>
</div>
</figure>

<!-- 3 Inbox -->
<figure id="s3">
<figcaption><b>03</b>Inbox (threaded)</figcaption>
<div class="phone">
  <div class="safe-top"></div>
  <div class="appbar">
    <button class="icon-btn" aria-label="Folders"><svg class="i" aria-hidden="true"><use href="#menu"/></svg></button>
    <div class="title"><strong>Inbox</strong><span>aman@akxr.in</span></div>
    <button class="icon-btn" aria-label="Switch mailbox"><svg class="i" aria-hidden="true"><use href="#down"/></svg></button>
  </div>
  <div class="chip-row">
    <button class="chip on">All</button><button class="chip">Unread</button><button class="chip">Has draft</button><button class="chip">Attachments</button>
  </div>
  <div class="scroll">
    <a class="row unread" href="#s5">
      <div class="avatar" style="background:#0F766E">P</div>
      <div class="body">
        <div class="top"><span class="from">Priya Raman <span class="count">3</span></span><span class="time">9:41</span></div>

      </div>
    </a>
    <a class="row unread" href="#s5">
      <div class="avatar" style="background:#7C3AED">G</div>
      <div class="body">
        <div class="top"><span class="from">GitHub</span><span class="time">8:15</span></div>
        <div class="subj">[cloudflare/agentic-inbox] PR #12 merged</div>
        <div class="snip">thomasgauvin merged 3 commits into main</div>
      </div>
    </a>
    <a class="row" href="#s5">
      <div class="avatar" style="background:#B45309">R</div>
      <div class="body">
        <div class="top"><span class="from">Rohan, Neha <span class="count">5</span></span><span class="time">Mon</span></div>
        <div class="subj">Offsite dates</div>
        <div class="snip">Works for me. I'll book the venue for the 24th.</div>
